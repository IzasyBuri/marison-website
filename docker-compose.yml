services:
  db:
    image: mariadb:${MARIADB_VERSION:-11.4}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-marison}
      MARIADB_USER: ${WORDPRESS_DB_USER:-marison}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-marison_local_db_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-marison_local_root_password}
    volumes:
      - marison_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:${WORDPRESS_VERSION:-7.1.3-php8.3-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-marison}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-marison}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-marison_local_db_password}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - marison_wordpress_core:/var/www/html
      - ./wp-content:/var/www/html/wp-content

volumes:
  marison_db_data:
  marison_wordpress_core:
